<!DOCTYPE html>
<html lang="fr" xmlns:layout="http://www.ultraq.net.nz/thymleaf/layout"
      layout:decorate="~{index}" xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Création d'un professeur</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="../../favicon.ico"/>


    <!-- Bootstrap core CSS -->
    <link href="../static/css/bootstrap.css" rel="stylesheet" th:href="@{/css/bootstrap.css}"/>
</head>
<body>
<h1 class="title text-center">Créer un professeur</h1>
<div class="content" layout:fragment="content">
<div class="form-group">
    <form method="post" th:action="@{/professeur/save}" th:object="${professeur}">

        <div class="col-3">
            <label class="form-label">Nom</label>
            <input class="form-control" type="text" name="nom" th:field="*{nom}" placeholder="Nom"/>
        </div>

        <div class="col-3">
            <label class="form-label">Prénom</label>
            <input class="form-control" type="text" name="nom" th:field="*{prenom}" placeholder="Prénom"/>
        </div>

        <div class="col-3">
            <label class="form-label">Email</label>
            <input class="form-control" type="text" name="nom" th:field="*{email}" placeholder="Email"/>
        </div>

        <div class="col-3">
            <label class="form-label">Mot de passe</label>
            <input class="form-control" type="password" name="nom" th:field="*{password}" placeholder="Mot de passe"/>
        </div>

        <div class="col-3">
            <label class="form-label">Etat</label>
            <input class="form-control" type="checkbox" name="nom" th:field="*{etat}" placeholder="Etat"/>
        </div>

        <!--<div>
            <input type="checkbox" id="etat" name="etat" value="etat">
            <label for="etat">Etat ?</label>
        </div>-->

        <div class="form-group">
            <input class="btn btn-success" type="submit" name="envoyer" value="Valider"/>
            <input class="btn btn-danger" type="reset" name="annuler" value="Effacer"/>
        </div>
    </form>
</div>
</div>
</body>
</html>

</body>
</html>
