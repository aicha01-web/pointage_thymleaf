<!DOCTYPE html>

<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymleaf/layout"
      layout:decorate="~{index}" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="../../favicon.ico"/>

    <title>Professeurs</title>

    <!-- Bootstrap core CSS -->
    <link href="../static/css/bootstrap.css" rel="stylesheet" th:href="@{/css/bootstrap.css}"/>
</head>
<body>
<div class="content" layout:fragment="content">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h2 class="title text-center">Liste professeurs</h2>
                </div>
                <div class="card-body">
                    <table class="table table-responsive table-bordered table-striped">
                        <tr>
                            <th>Prénom</th>
                            <th>Nom</th>
                            <th>Email</th>
                            <th>Etat</th>
                            <th>Actions</th>
                        </tr>
                        <tr th:each="p:${professeursList}">
                            <td th:text="${p.prenom}"></td>
                            <td th:text="${p.nom}"></td>
                            <td th:text="${p.email}"></td>
                            <td th:text="${p.etat}"></td>
                            <td><a th:href="@{/edit/{id}(id=${p.id})}">Modifier</a></td>
                        </tr>
                    </table>
                </div>

            </div>
        </div>
    </div>

<</div>

</body>
</html>
