<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymleaf/layout"
      layout:decorate="~{index}" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Modification</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css"
          integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO"
          crossorigin="anonymous">
</head>
<body>


<div class="content" layout:fragment="content">
    <h1>Modifier professeur</h1></br>
    <form action="#"
          th:action="@{/update/{id}(id=${professeur.id})}"
          th:object="${professeur}"
          method="post">
        <div class="form-group">
            <label for="nom">Nom</label>
            <input type="text" th:field="*{nom}" id="nom" placeholder="Nom">
        </div>
        <!--    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>-->
        <div class="form-group">
            <label for="prenom">Prenom</label>
            <input type="text" th:field="*{prenom}" id="prenom" placeholder="Prenom">
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="text" th:field="*{email}" id="email" placeholder="Email">
        </div>

        <div class="form-group">
            <label for="password">Mot de passe</label>
            <input type="text" th:field="*{password}" id="password" placeholder="Mot de passe">
        </div>

        <div class="form-group">
            <label for="etat">Etat</label>
            <input type="text" th:field="*{etat}" id="etat" placeholder="Etat">
        </div>


        <!--    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>-->
        <div class="form-group">
            <input type="submit" value="Modifier">
        </div>
    </form>
</div>
</body>
</html>
