<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymleaf/layout"
      layout:decorate="~{index}" xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Modification</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="../../favicon.ico"/>


    <!-- Bootstrap core CSS -->
    <link href="../static/css/bootstrap.css" rel="stylesheet" th:href="@{/css/bootstrap.css}"/>
</head>

<body>

<h1>Modifier étudiant</h1></br>
<div class="content" layout:fragment="content">
    <div class="row">
        <div class="col-10">
            <div class="card card-chart">
                <h2 class="title text-center">Modifier un(e) étudiant(e)</h2>
                </br>
                <div class="card-body">
                    <div class="form-group">
                        <form action="#"
                              th:action="@{/updateEtudiant/{id}(id=${etudiant.id})}"
                              th:object="${etudiant}"
                              method="post">
                            <div class="row">
                                <div class="col-3">
                                    <label class="form-label">Nom</label>
                                    <input class="form-control" type="text" name="nom" th:field="*{nom}"
                                           placeholder="Nom"/>
                                </div>

                                <div class="col-3">
                                    <label class="form-label">Prénom</label>
                                    <input class="form-control" type="text" name="nom" th:field="*{prenom}"
                                           placeholder="Prénom"/>
                                </div>
                            </div>
                            <div class="row">

                                <div class="col-3">
                                    <label class="form-label">Email</label>
                                    <input class="form-control" type="text" name="nom" th:field="*{email}"
                                           placeholder="Email"/>
                                </div>

                                <div class="col-3">
                                    <label class="form-label">Numéro étudiant</label>
                                    <input class="form-control" type="number" name="nom" th:field="*{numeroetudiant}"
                                           placeholder="Numéro étudiant"/>
                                </div>
                            </div>
                            <div class="row">
                                <div class="col-3">
                                    <label class="form-label">Mot de passe</label>
                                    <input class="form-control" type="password" name="nom" th:field="*{password}"
                                           placeholder="Mot de passe"/>
                                </div>

                                <div class="col-3">
                                    <label class="form-label">Date de naissance</label>
                                    <input class="form-control" type="date" name="nom" th:field="*{datenaissance}"
                                           placeholder="Etat"/>
                                </div>
                            </div>

                            <div class="col-3">
                                <select th:field="*{classe}" class="form-control">
                                    <option value="">Selectionnez la classe</option>
                                    <option th:each="classe : ${classes}" th:value="${classe.id}"
                                            th:text="${classe.nom}"></option>
                                </select>
                            </div>
                            <!--    <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>-->

                            <!--    <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>-->
                            <div class="form-group">
                                <input class="btn btn-success" type="submit" value="Modifier">
                                <input class="btn btn-danger" th:href="@{/etudiant/getAll}" type="submit"
                                       value="Annuler"/>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
