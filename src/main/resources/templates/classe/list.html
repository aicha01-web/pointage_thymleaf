<!DOCTYPE html>

<html lang="fr" xmlns:layout="http://www.ultraq.net.nz/thymleaf/layout"
      layout:decorate="~{index}" xmlns:th="http://www.thymeleaf.org">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="../../favicon.ico"/>

    <title>Classes</title>

    <!-- Bootstrap core CSS -->
    <link href="../static/css/bootstrap.css" rel="stylesheet" th:href="@{/css/bootstrap.css}"/>
</head>
<body>
<div class="content" layout:fragment="content">
    <div class="row">
        <div class="col-md-12">
            <div class="card">
                <div class="card-header">
                    <h2 class="title text-center">Liste des classes</h2>
                </div>
                <div class="card-body">
                    <a th:href="@{/classe/add}">Créer <span class="tim-icons icon-simple-add"></span></i></a>
                    <!--                    <a th:href="@{/professeur/add}" class="btn btn-primary btn-lg active" role="button" aria-pressed="true">Créer</a>-->
                    <div class="table-responsive">
                        <table class="table tablesorter " id="">
                            <thead class=" text-primary">
                            <tr>
                                <th>Nom de la classe</th>
                                <th>Actions</th>
                            </tr>
                            <tr th:each="c:${classesList}">
                                <td th:text="${c.nom}"></td>
                                <td><a th:href="@{/editClasse/{id}(id=${c.id})}"><i
                                        class="tim-icons icon-pencil"></i></a>
                                    <a th:href="@{/deleteClasse/{id}(id=${c.id})}"><i
                                            class="tim-icons icon-trash-simple"></i></a></td>
                            </tr>
                        </table>
                    </div>
                </div>

            </div>
        </div>
    </div>

</div>

</body>
</html>
