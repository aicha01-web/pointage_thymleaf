<!DOCTYPE html>
<html lang="fr" xmlns:layout="http://www.ultraq.net.nz/thymleaf/layout"
      layout:decorate="~{index}" xmlns:th="http://www.thymeleaf.org">
<head>

    <title>Création d'une classe</title>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <!-- The above 3 meta tags *must* come first in the head; any other head content must come *after* these tags -->
    <meta name="description" content="">
    <meta name="author" content="">
    <link rel="icon" href="../../favicon.ico"/>


    <!-- Bootstrap core CSS -->
    <link href="../static/css/bootstrap.css" rel="stylesheet" th:href="@{/css/bootstrap.css}"/>
</head>
<body>
<div class="content" layout:fragment="content">
    <div class="row">
        <div class="col-10">
            <div class="card card-chart">
                <h2 class="title text-center">Ajouter une classe</h2>
                </br>
                <div class="card-body">
                    <div class="form-group">
                        <form method="post" th:action="@{/classe/save}" th:object="${classe}">

                            <div class="col-3">
                                <label class="form-label">Nom</label>
                                <input class="form-control" type="text" name="nom" th:field="*{nom}" placeholder="Nom"/>
                            </div>

                            <div class="form-group">
                                <input class="btn btn-success" type="submit" name="envoyer" value="Valider"/>
                                <input class="btn btn-danger" type="reset" name="annuler" value="Effacer"/>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>

</body>
</html>
